- event_id: u01_trip
  goals: ["从上海前往北京参加重要客户会议。"]
  interaction: "初次提出出差需求。"
- event_id: u02_dates_budget
  goals: ["11月22日出发、25日返回，11月23日09:00参加客户会议。"]
  constraints: ["交通、住宿和市内交通合计不超过4800元。"]
  interaction: "补充日期、会议时间和预算；只从本次披露起适用。"
- event_id: u03_preferences
  preferences: ["优先经济舱。", "酒店尽量靠近客户会议地点。"]
  constraints: ["22日晚到酒店时需保留房间。"]
- event_id: u04_authorization
  preferences: ["重要行程变化和需要用户决策的事项应主动告知。"]
  constraints: ["付款、取消预订、额外付费改签必须先得到用户授权。", "普通日程维护、酒店晚到登记、索取发票可自行处理。"]
  interaction: "授权边界从此刻开始明确。"
- event_id: u05_meeting
  goals: ["客户会议原定11月23日09:00在北京国贸A座。", "回来后整理报销并索取酒店发票。"]
- event_id: u12_goal_update
  goals: ["会议地点变化后，仍以准时到达客户会议为优先。", "用22日G112高铁恢复可行的去程。"]
  constraints: ["仅授权购买22日G112票，价格不超过900元；其他付款仍需另行授权。", "不为了早餐升级酒店。"]
  interaction: "用户批准具体替代交通并更新会议地点目标；以后不得按旧会议地点规划。"
- event_id: u20_priority_cancel
  goals: ["客户会议优先于内部评审；内部评审可顺延。"]
  constraints: ["酒店发票已由用户自行领取，停止代为索取。"]
  interaction: "用户明确会议优先级，并取消此前的酒店发票代理目标。"
