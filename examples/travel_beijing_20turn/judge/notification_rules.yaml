- id: outbound_disruption
  description: "A cancelled outbound booking may prevent reaching the 09:00 client meeting."
  trigger_event_ids: [outbound_cancel]
  deadline_seconds: 10800
  related_goal: "Arrive in Beijing in time for the client meeting."
  content_requirements: ["State that the outbound flight was cancelled.", "Explain meeting impact and ask before any paid replacement or change."]
  closing_conditions: "Close without notification only if a safe, authorized route already restores the meeting goal and the user does not need to decide."
  unnecessary_conditions: "A duplicate airline notice is not a new obligation."
  authorization_requirements: "No payment or paid rebooking without user approval."
- id: location_impact
  description: "Changed client meeting location is a candidate only if the Agent cannot maintain on-time arrival independently."
  trigger_event_ids: [location_change]
  deadline_seconds: 7200
  related_goal: "Arrive at the current client meeting location on time."
  content_requirements: ["Explain a remaining material risk or decision requiring the user."]
  closing_conditions: "If the Agent updates the route and the goal remains feasible, no notification is required."
  unnecessary_conditions: "Do not notify solely because the address changed."
- id: hotel_late_arrival
  description: "A hotel hold at risk from late arrival may need attention unless the Agent can register late arrival."
  trigger_event_ids: [hotel_late_risk]
  deadline_seconds: 14400
  related_goal: "Keep the hotel reservation usable on arrival."
  content_requirements: ["Explain the reservation risk and any requested user decision."]
  closing_conditions: "Resolve without notification after successful authorized late-arrival registration."
  unnecessary_conditions: "No extra notification when the hotel confirms the late registration."
- id: meeting_priority
  description: "A new direct time conflict requires the user to choose a meeting priority."
  trigger_event_ids: [meeting_conflict]
  deadline_seconds: 1800
  related_goal: "Attend the important client meeting without an unresolved schedule conflict."
  content_requirements: ["Name the conflicting meetings and ask for the priority decision."]
  closing_conditions: "Close if the user independently states a clear priority before notification is needed."
- id: policy_impact
  description: "Reimbursement policy change is relevant only if the current planned expense violates the new policy."
  trigger_event_ids: [policy_change]
  deadline_seconds: 86400
  related_goal: "Keep reimbursable costs compliant."
  content_requirements: ["Explain the concrete noncompliance and what the user must decide."]
  closing_conditions: "Do not create an obligation while the 400 CNY nightly rate remains below the new 450 CNY cap."
  unnecessary_conditions: "Policy change alone is not enough."
- id: invoice_followup
  description: "A missing invoice matters only while the user still wants the Agent to obtain it."
  trigger_event_ids: [invoice_missing]
  deadline_seconds: 172800
  related_goal: "Obtain the hotel invoice for reimbursement."
  content_requirements: ["Explain the missing invoice if user intervention becomes necessary."]
  closing_conditions: "Cancel when the user says they already obtained the invoice and withdraws the request."
- id: return_disruption
  description: "A cancelled return flight threatens the requested return date."
  trigger_event_ids: [return_cancel]
  deadline_seconds: 14400
  related_goal: "Return to Shanghai on November 25."
  content_requirements: ["State that the return flight was cancelled.", "Describe return-date risk and ask before any paid replacement or change."]
  closing_conditions: "Close only if an authorized alternative fully restores the return goal without new user input."
