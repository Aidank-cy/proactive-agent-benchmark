  trigger_event_ids: [ev008]
  deadline_seconds: 32400
  related_goal: "按时到北京参加客户会议"
  content_requirements: ["准确说明原去程航班取消及对会议的风险。", "需要付款或付费改签时先询问授权，不把未确认余票说成已出票。"]
  closing_conditions: "若已在授权范围内恢复可靠的准时到达方案，且用户不需要决策，可以关闭。"
